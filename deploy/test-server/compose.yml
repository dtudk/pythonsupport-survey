# Usage (from this folder):
#   docker compose up -d --build           # boot a fresh "server"
#   docker compose exec server bash        # log in as root
#   docker compose down                    # wipe it; next `up` is a fresh server again
services:
  server:
    build: .
    hostname: survey-test
    privileged: true          # needed for systemd to run inside the container
    tmpfs:
      - /run
      - /run/lock
    ports:
      - "8080:2810"           # the site: http://localhost:8080
    volumes:
      # Your checkout, read-only. Clone from it inside the container; it becomes `origin`,
      # so manage.sh update deploys whatever you've committed locally.
      - ../..:/mnt/repo:ro
