<style>
  #problemLogPage #problemLogCard { max-width: 60rem; }
  #problemLogPage input[type="checkbox"] { width: 1.1rem; height: 1.1rem; }
</style>

<div id="problemLogPage" class="px-2 sm:px-4 grid place-items-center" style="min-height: calc(100vh - 4rem);">
  <section id="problemLogCard" class="w-full max-w-5xl xl:max-w-6xl mx-auto bg-white rounded-lg shadow-lg p-4 sm:p-6 md:p-8" aria-labelledby="problemLogTitle">
    <header class="mb-6">
      <h2 id="problemLogTitle" class="text-3xl md:text-4xl font-bold text-gray-700">Supporter Problem Log</h2>
      <p class="text-gray-500 mt-1">Record common issues after helping a student.</p>
    </header>

    <form id="problemLogForm" class="space-y-6">
      <fieldset>
        <legend class="block text-gray-700 mb-3 font-medium text-lg md:text-xl">Common problems</legend>
        <div class="grid gap-3 sm:grid-cols-2">
          <label class="flex items-center border-2 border-gray-200 rounded-lg p-4 hover:border-red-300 hover:bg-red-50 transition-colors cursor-pointer">
            <input type="checkbox" name="problems" value="Files and Folders" class="text-red-500 border-gray-300 rounded">
            <span class="ml-3 text-gray-700">Files and Folders</span>
          </label>

          <label class="flex items-center border-2 border-gray-200 rounded-lg p-4 hover:border-red-300 hover:bg-red-50 transition-colors cursor-pointer">
            <input type="checkbox" name="problems" value="Trust issues VS Code" class="text-red-500 border-gray-300 rounded">
            <span class="ml-3 text-gray-700">Trust issues VS Code</span>
          </label>

          <label class="flex items-center border-2 border-gray-200 rounded-lg p-4 hover:border-red-300 hover:bg-red-50 transition-colors cursor-pointer">
            <input type="checkbox" name="problems" value="MS Powershell / Mini Forge Prompt" class="text-red-500 border-gray-300 rounded">
            <span class="ml-3 text-gray-700">MS Powershell / Mini Forge Prompt</span>
          </label>

          <label class="flex items-center border-2 border-gray-200 rounded-lg p-4 hover:border-red-300 hover:bg-red-50 transition-colors cursor-pointer">
            <input type="checkbox" name="problems" value="Starting Idle" class="text-red-500 border-gray-300 rounded">
            <span class="ml-3 text-gray-700">Starting Idle</span>
          </label>

          <label class="flex items-center border-2 border-gray-200 rounded-lg p-4 hover:border-red-300 hover:bg-red-50 transition-colors cursor-pointer">
            <input type="checkbox" name="problems" value="MS Start App" class="text-red-500 border-gray-300 rounded">
            <span class="ml-3 text-gray-700">MS Start App</span>
          </label>

          <label class="flex items-center border-2 border-gray-200 rounded-lg p-4 hover:border-red-300 hover:bg-red-50 transition-colors cursor-pointer">
            <input type="checkbox" name="problems" value="Antivirus" class="text-red-500 border-gray-300 rounded">
            <span class="ml-3 text-gray-700">Antivirus</span>
          </label>
        </div>
      </fieldset>

      <div>
        <label class="block text-gray-700 mb-2 font-medium text-lg" for="problemOther">Other</label>
        <textarea id="problemOther" name="other" rows="3" placeholder="Write the problem here." class="w-full border border-gray-300 p-3 sm:p-4 text-lg rounded focus:ring-2 focus:ring-red-500 focus:border-red-500"></textarea>
      </div>

      <p id="problemLogError" class="hidden text-red-600" role="alert"></p>

      <button id="problemSubmitButton" type="submit" class="bg-red-500 text-white px-8 py-4 text-lg rounded-lg hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed w-full font-medium transition-colors">
        Submit Problem
      </button>
    </form>
  </section>
</div>

<div id="problemLogSuccessModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
  <div class="bg-white p-6 rounded-lg shadow-lg text-center max-w-xs mx-4">
    <h2 class="text-xl font-semibold mb-2 text-gray-800">Problem logged</h2>
    <p class="mb-4 text-gray-600">The supporter note was submitted successfully.</p>
    <button id="closeProblemLogSuccess" type="button" class="mt-2 bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">Close</button>
  </div>
</div>
