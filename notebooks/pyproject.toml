[project]
name = "notebooks"
version = "0.1.0"
description = "Jupyter notebooks for the survey data, and the pis_lib package they share"
authors = [
    { name = "Tiago Alfageme", email = "ercolealfageme@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "ipykernel>=7.4.0",
    "mssql-python>=1.16.0",
    "nbclient>=0.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "vl-convert-python>=1.9.0.post1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pis_lib"  # src/pis_lib, not src/notebooks

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
